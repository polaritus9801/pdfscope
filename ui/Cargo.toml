[package]
name = "pdfscope-ui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
pdfscope-core = { path = "../crates/pdfscope-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "File",
    "FileList",
    "Event",
    "MouseEvent",
    "DomRect",
    "DataTransfer",
    "DragEvent",
    "EventTarget",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
