[graph]
all-features = false
no-default-features = false
exclude-dev = true

[advisories]
version = 2
# Fail the build on any advisory that is not explicitly ignored below.
ignore = []

[licenses]
version = 2
# Permissive licenses only. Anything copyleft would need an ADR: this project intends to stay
# MIT-licensed for downstream users.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # A second async runtime in the tree is almost always an accident.
    { name = "openssl-sys", reason = "use rustls; the system TLS stack breaks the static build story" },
]
