[workspace]
resolver = "3"
members = [
    "crates/pdfscope-core",
    "crates/pdfscope-proto",
    "crates/pdfscope-store",
    "crates/pdfscope-ai",
    "crates/pdfscope-api",
    "crates/pdfscope-server",
    "crates/pdfscope-desktop",
]
default-members = [
    "crates/pdfscope-core",
    "crates/pdfscope-proto",
    "crates/pdfscope-store",
    "crates/pdfscope-ai",
    "crates/pdfscope-api",
    "crates/pdfscope-server",
    "crates/pdfscope-desktop",
]
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["z1mLi"]
repository = "https://github.com/polaritus9801/pdfscope"

[workspace.dependencies]
# Internal
pdfscope-core = { path = "crates/pdfscope-core" }
pdfscope-proto = { path = "crates/pdfscope-proto" }
pdfscope-store = { path = "crates/pdfscope-store" }
pdfscope-ai = { path = "crates/pdfscope-ai" }
pdfscope-api = { path = "crates/pdfscope-api" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# Storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# Time
time = { version = "0.3", features = ["formatting", "parsing"] }

# Hashing
sha2 = "0.10"

# Testing
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
